[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
disallow_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = false
no_implicit_optional = true
check_untyped_defs = false
files = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Default rule set is fast and opinionated; turn off a few that fight
# with Pydantic / SQLAlchemy patterns.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function call in default argument (Pydantic pattern)
    "UP007", # X | Y unions (we target 3.10+ but allow Optional[X])
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts are fine in tests
"scripts/*" = ["E402"]  # sys.path manipulation

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning:google",
    "ignore::FutureWarning:ragas",
]
